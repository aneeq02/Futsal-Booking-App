<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ground's List</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flatpickr/4.6.13/flatpickr.min.css">
  <link rel="stylesheet" href="src/css/output.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Sigmar&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Sigmar&family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
</head>

<body class="bg-gradient-to-b from-green-900 to-blue-200 bg-no-repeat">
  <header>
    <nav class="flex justify-around text-[#FEFAE0] drop-shadow-[0_1.2px_1.2px_rgba(0,0,0,0.9)] w-[98vw]">
      <div class="px-5 xl:px-12 py-6 flex w-full items-center">
        <a class="text-3xl  font-heading font-sigmar text-[#d2742c]" href="#">
          Footy.com
        </a>

        <ul class="md:flex px-4 mx-auto font-semibold font-heading space-x-12">
          <li><a class="hover:text-[#DF6D14]" href="index.html">Home</a></li>
          <li><a class="hover:text-gray-200" href="grounds.html">Ground's List</a></li>
        </ul>
      </div>
      </div>
    </nav>
  </header>
  <main>
    <h1 class="text-[#FEFAE0] drop-shadow-[0_1.2px_1.2px_rgba(0,0,0,0.8)] text-5xl font-extrabold my-2 text-center">BOOK
      NOW!</h1>


    <div class="w-1/2 mx-auto my-8">
      <form class="flex flex-col md:flex-row gap-3 items-center bg-white shadow-md p-4 rounded-lg">

        <div>
          <select id="filter" name="category"
            class="bg-gray-100 border border-gray-300 text-gray-900 text-sm rounded-lg block w-full py-2.5 px-1 focus:ring-blue-500 focus:border-blue-500">
            <option value="">All</option>
            <option value="design">Gulshan Iqbal</option>
            <option value="code">Gulistan E Johar</option>
            <option value="marketing">Defense</option>
            <option value="content">Nazimabad</option>
          </select>
        </div>


        <!-- Search Bar -->
        <div class="relative w-full">
          <input type="text" id="filter-search" placeholder="Search..."
            class="w-full px-4 py-2 text-gray-700 bg-gray-100 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>

        <!-- Button -->
        <button type="submit"
          class="px-4 py-2 w-full md:w-auto text-white rounded-md bg-gradient-to-br from-[#013220] to-[#39ff14] hover:bg-gradient-to-bl focus:ring-4 focus:outline-none focus:ring-green-200 dark:focus:ring-green-800 transition">
          Search
        </button>

      </form>
    </div>

    <div class="flex justify-center items-center flex-wrap" id="grounds-container">
      <div id="loading-indicator" class="w-full text-center py-4">Loading grounds...</div>
      <div id="no-grounds-message" class="hidden w-full text-center text-gray-500 mt-8">
        No grounds available at the moment. Please check back later.
      </div>
    </div>

  </main>

  <footer>
    <div class="w-full max-w-screen-xl mx-auto p-4 md:py-8">
      <div class="sm:flex sm:items-center sm:justify-between">
        <a class="text-3xl  font-heading font-sigmar text-[#d2742c] drop-shadow-[0_1.2px_1.2px_rgba(0,0,0,0.9)]"
          href="#">
          Footy.com
        </a>
        <ul class="flex flex-wrap items-center mb-6 text-sm font-medium text-gray-500 sm:mb-0 dark:text-gray-400">
          <li>
            <a href="#" class="hover:underline me-4 md:me-6">About</a>
          </li>
          <li>
            <a href="#" class="hover:underline me-4 md:me-6">Privacy Policy</a>
          </li>
          <li>
            <a href="#" class="hover:underline me-4 md:me-6">Licensing</a>
          </li>
          <li>
            <a href="#" class="hover:underline">Contact</a>
          </li>
        </ul>
      </div>
      <hr class="my-6 border-gray-200 sm:mx-auto dark:border-gray-700 lg:my-8" />
      <span class="block text-sm text-gray-500 sm:text-center dark:text-gray-400">© 2023 <a href="https://flowbite.com/"
          class="hover:underline">Flowbite™</a>. All Rights Reserved.</span>
    </div>
  </footer>
  <script src="./src/js/grounds.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>
</body>

</html>
